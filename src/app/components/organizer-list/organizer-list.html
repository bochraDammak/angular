<div class="container">
  <h2 class="text-center my-4">Organizers ({{ organizers.length }})</h2>

  <div class="d-flex flex-wrap justify-content-center gap-3">
    @for (organizer of organizers; track organizer.id)
    {
      <div class="card text-center mini-card">
        <img class="card-img-top" [src]="organizer.picture" [alt]="organizer.name" />
        <div class="card-body p-2">
          <h6 class="card-title mb-1">{{ organizer.name }}</h6>
          <p class="card-text small mb-1">
            <a [href]="'mailto:' + organizer.email">{{ organizer.email }}</a>
          </p>
          <p class="card-text small mb-0">{{ organizer.university }}</p>
        </div>
      </div>
    }
  </div>
</div>
